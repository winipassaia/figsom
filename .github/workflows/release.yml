name: Release

# Cria os instaladores e publica a release quando uma tag "v*" é enviada.
# Também dá pra rodar manualmente (Actions → Release → Run workflow) só pra gerar os arquivos.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Os jobs de build rodam código de terceiros (npm ci): só leitura. Escrita só no job "release".
permissions:
  contents: read

# ffmpeg fixo: build LGPL de fim de mês do FFmpeg-Builds (os de fim de mês ficam guardados por ~2 anos).
# Pra atualizar: escolha um autobuild-AAAA-MM-DD de fim de mês em
# https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases e copie os nomes e os SHA-256 do checksums.sha256.
env:
  FFMPEG_TAG: autobuild-2026-10-31-12-59
  FFMPEG_VERSAO: n9.0.2-39-g7adfbe40dc
  FFMPEG_COMMIT: 7adfbe40dc
  FFMPEG_WIN: ffmpeg-n9.0.2-39-g7adfbe40dc-win64-lgpl-9.0
  FFMPEG_WIN_SHA256: 9d37c564e0d01c18cde184a079fa6ef04d7d2783ada41da81d04165cc8f1a650
  FFMPEG_LINUX: ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-lgpl-9.0
  FFMPEG_LINUX_SHA256: 6046d6731b26f58887e953561551d254a6eec9fbca4100dfeab56e19af8328d5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: win
            ffmpeg: vendor/ffmpeg/ffmpeg.exe
          - os: ubuntu-latest
            alvo: linux
            ffmpeg: vendor/ffmpeg/ffmpeg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir se a tag bate com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($v). Use npm version pra criar a tag."
            exit 1
          fi

      - run: npm ci

      # precisa de libwebp (figurinha) e libopus (áudio)
      - name: Baixar ffmpeg (Windows)
        if: matrix.alvo == 'win'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_WIN.zip" -OutFile ff.zip
          $hash = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "SHA-256 do ffmpeg não confere: $hash" }
          Expand-Archive ff.zip -DestinationPath ff
          $pasta = (Get-ChildItem ff -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$pasta/bin/ffmpeg.exe" vendor/ffmpeg/
          Copy-Item "$pasta/LICENSE.txt" vendor/ffmpeg/LICENSE-ffmpeg.txt
          $enc = & vendor/ffmpeg/ffmpeg.exe -hide_banner -encoders
          if (-not ($enc | Select-String 'libwebp')) { throw 'ffmpeg sem libwebp' }
          if (-not ($enc | Select-String 'libopus')) { throw 'ffmpeg sem libopus' }

      - name: Baixar ffmpeg (Linux)
        if: matrix.alvo == 'linux'
        run: |
          curl -fsSL -o ff.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_LINUX.tar.xz"
          echo "$FFMPEG_LINUX_SHA256  ff.tar.xz" | sha256sum -c -
          mkdir ff && tar -xJf ff.tar.xz -C ff --strip-components=1
          mkdir -p vendor/ffmpeg
          cp ff/bin/ffmpeg vendor/ffmpeg/
          chmod +x vendor/ffmpeg/ffmpeg
          cp ff/LICENSE.txt vendor/ffmpeg/LICENSE-ffmpeg.txt
          vendor/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libwebp
          vendor/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libopus

      # formato da figurinha com som + conversão com o MESMO ffmpeg que vai no app
      - name: Testes
        run: npm test
        env:
          FIGSOM_FFMPEG: ${{ github.workspace }}/${{ matrix.ffmpeg }}

      - name: Empacotar
        run: npx electron-builder --${{ matrix.alvo }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: figsom-${{ matrix.alvo }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Publicar release
        run: |
          set -euo pipefail
          # somas SHA-256 pra quem quiser conferir os arquivos (o app não tem assinatura digital)
          (cd arquivos && sha256sum -- * > SHA256SUMS.txt)
          cp .github/NOTAS_RELEASE.md notas.md
          printf '\n<sub>FFmpeg incluído nesta versão: `%s` (build LGPL `%s` do [FFmpeg-Builds](https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/tag/%s)). Código-fonte dessa versão do FFmpeg: https://github.com/FFmpeg/FFmpeg/tree/%s</sub>\n' \
            "$FFMPEG_VERSAO" "$FFMPEG_WIN / $FFMPEG_LINUX" "$FFMPEG_TAG" "$FFMPEG_COMMIT" >> notas.md
          if gh release view "$GITHUB_REF_NAME" --json body -q .body > corpo.txt 2>/dev/null; then
            # release criada pelo site do GitHub: anexa os arquivos e só preenche as notas se estiverem vazias
            gh release upload "$GITHUB_REF_NAME" arquivos/* --clobber
            if [ -z "$(tr -d '[:space:]' < corpo.txt)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notas.md
            else
              echo "A release já tem notas escritas; mantive as suas."
            fi
          else
            gh release create "$GITHUB_REF_NAME" arquivos/* --title "figsom $GITHUB_REF_NAME" --notes-file notas.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
