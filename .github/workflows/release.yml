name: Release

# Cria os instaladores e publica a release quando uma tag "v*" é enviada.
# Também dá pra rodar manualmente (Actions → Release → Run workflow) só pra gerar os arquivos.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: win
          - os: ubuntu-latest
            alvo: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ffmpeg LGPL (BtbN/FFmpeg-Builds): precisa de libwebp (figurinha) e libopus (áudio)
      - name: Baixar ffmpeg (Windows)
        if: matrix.alvo == 'win'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $pasta = (Get-ChildItem ff -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$pasta/bin/ffmpeg.exe" vendor/ffmpeg/
          Copy-Item "$pasta/LICENSE.txt" vendor/ffmpeg/LICENSE-ffmpeg.txt
          $enc = & vendor/ffmpeg/ffmpeg.exe -hide_banner -encoders
          if (-not ($enc | Select-String 'libwebp')) { throw 'ffmpeg sem libwebp' }
          if (-not ($enc | Select-String 'libopus')) { throw 'ffmpeg sem libopus' }

      - name: Baixar ffmpeg (Linux)
        if: matrix.alvo == 'linux'
        run: |
          curl -fsSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          mkdir ff && tar -xJf ff.tar.xz -C ff --strip-components=1
          mkdir -p vendor/ffmpeg
          cp ff/bin/ffmpeg vendor/ffmpeg/
          cp ff/LICENSE.txt vendor/ffmpeg/LICENSE-ffmpeg.txt
          vendor/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libwebp
          vendor/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libopus

      - name: Empacotar
        run: npx electron-builder --${{ matrix.alvo }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: figsom-${{ matrix.alvo }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Publicar release
        run: |
          # se a release já foi criada pelo site do GitHub, só anexa os arquivos e completa as notas
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" arquivos/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "figsom $GITHUB_REF_NAME" --notes-file .github/NOTAS_RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" arquivos/* --title "figsom $GITHUB_REF_NAME" --notes-file .github/NOTAS_RELEASE.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
